services:
  - type: web
    name: local-ai-agent-api
    runtime: docker
    rootDir: apps/agent-backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_CHOICE
        value: gpt-4o-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false

  - type: web
    name: local-ai-frontend
    runtime: static
    rootDir: apps/agent-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AGENT_ENDPOINT
        value: https://local-ai-agent-api.onrender.com/api/pydantic-agent
